modLoader="kotlinforforge"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/LilTOJustice/TrueAdaptiveMusic/issues"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL="https://liltojustice.github.io/TrueAdaptiveMusic/"
logoFile="assets/trueadaptivemusic/icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="trueadaptivemusic.client.mixins.json"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="${loader_version_range}"
ordering="NONE"
side="CLIENT"
